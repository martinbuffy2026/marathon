/* ===== Progress ===== */
function viewProgress() {
  const t = today(), cur = Math.min(PLAN.length, Math.max(0, weekNo(t)));
  const runs = allRuns();
  const planRuns = runs.filter(r => r.src === 'plan');
  let planned = 0, done = 0;
  for (let w = 1; w <= Math.max(cur, 1); w++) for (const s of weekSessions(w)) { if (s.date <= t && !s.extra) { planned++; if (sessionStatus(s) === 'done') done++; } }
  const longest = runs.reduce((m, r) => Math.max(m, r.km), 0);
  const thisWeek = cur >= 1 ? weekKmDone(cur) : 0;
  const exOpts = Object.keys(EXERCISES).map(k => `<option value="${k}" ${ui.chartEx === k ? 'selected' : ''}>${esc(EXERCISES[k].name)}</option>`).join('');
  return `<section class="head"><h1>Progress</h1><p class="muted">Your logged work against the plan. Charts update as you log.</p></section>
  <div class="tiles">
    <div class="tile"><span class="eyebrow">Workouts done</span><b>${done}<small> / ${planned}</small></b><span class="muted">planned so far</span></div>
    <div class="tile"><span class="eyebrow">This week</span><b>${fmtKm(thisWeek)}<small> / ${cur >= 1 ? fmtKm(weekKmPlanned(cur)) : 0} km</small></b><span class="muted">${cur >= 1 ? 'Week ' + cur : 'Starts Oct 26'}</span></div>
    <div class="tile"><span class="eyebrow">Longest run</span><b>${fmtKm(longest)}<small> km</small></b><span class="muted">target 30 km by May 9</span></div>
    ${(() => { const wl = weightLog(), last = wl[wl.length - 1], g = weightGoalAt(t), st = settings();
      const lastV = last ? last.v : st.wStart; const diff = Math.round((lastV - weightGoalAt(last ? last.date : t)) * 10) / 10;
      return `<div class="tile"><span class="eyebrow">Body weight</span><b>${lastV}<small> / ${st.wGoal} ${UNIT()}</small></b><span class="muted">${last ? (diff <= 1 ? 'On track' : diff.toFixed(1) + ' above this week\u2019s goal') : 'Goal today ' + g}</span></div>`; })()}
  </div>
  ${coachCard(t)}
  ${weekByWeek(cur)}
  <section class="card chart-card"><h2>Weekly distance</h2><p class="muted">Planned kilometres per week, with what you ran on top.</p>
    <div class="legend"><span><i class="sw plan"></i>Planned</span><span><i class="sw done"></i>Ran</span></div><div class="chart" id="ch-week"></div></section>
  <section class="card chart-card"><h2>Long run</h2><p class="muted">The plan's long run each week against your longest run that week.</p>
    <div class="legend"><span><i class="sw line-plan"></i>Planned</span><span><i class="sw done"></i>Ran</span></div><div class="chart" id="ch-long"></div></section>
  <section class="card chart-card"><h2>Strength</h2>
    <label class="fld inline"><span>Exercise</span><select id="chart-ex" data-act="chartex">${exOpts}</select></label>
    <div class="legend"><span><i class="sw line-plan"></i>Goal</span><span><i class="sw done"></i>Your best set</span></div><div class="chart" id="ch-str"></div></section>
  <section class="card chart-card"><h2>Running pace</h2><p class="muted">Every run with a time, including your past treadmill runs. Higher is faster.</p>
    <div class="legend"><span><i class="sw past"></i>Before the plan</span><span><i class="sw done"></i>Plan runs</span></div><div class="chart" id="ch-pace"></div></section>
  <section class="card chart-card"><h2>Body weight</h2><p class="muted">Goal: ${settings().wStart} → ${settings().wGoal} ${UNIT()} by race day, about 1 ${UNIT()} a week.</p>
    <div class="legend"><span><i class="sw line-plan"></i>Goal</span><span><i class="sw done"></i>Logged</span></div><div class="chart" id="ch-bw"></div></section>`;
}

function weekByWeek(cur) {
  const last = Math.min(PLAN.length, Math.max(1, cur));
  let rows = '';
  for (let w = last; w >= 1; w--) {
    const m = weekSummary(w), ws = weekStart(w);
    rows += `<div class="wbw-row"><div class="wbw-h"><b>Week ${w}</b><span class="muted">${MON[parseISO(ws).getMonth()]} ${parseISO(ws).getDate()}${w === cur ? ' · this week' : ''}</span></div>${summaryHTML(m, true)}</div>`;
  }
  return `<section class="card"><h2>Week by week</h2><p class="muted">Kilometres, workouts, weight change and calories for each week, including any extra workouts you add.</p><div class="wbw">${rows}</div></section>`;
}

/* ---------- charts (hand-drawn SVG, sized to their box) ---------- */
function niceTicks(min, max, n) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || raw;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
function svgWrap(W, H, inner, label) { return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">${inner}</svg>`; }
function emptyChart(el, msg) { el.innerHTML = `<div class="chart-empty">${esc(msg)}</div>`; }

function barChart(el, cats, planned, done, label, opts = {}) {
  const W = Math.max(280, el.clientWidth), H = 190, m = { l: 34, r: 8, t: 10, b: 24 };
  const max = Math.max(...planned, ...done, 1);
  const yt = niceTicks(0, max, 4), ymax = yt[yt.length - 1];
  const iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / cats.length;
  const y = v => m.t + ih - v / ymax * ih;
  let s = '';
  for (const v of yt) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${m.l - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  cats.forEach((c, i) => {
    const x = m.l + i * bw;
    if (opts.line) {
      // planned as a step line
    } else s += `<rect class="b-plan" x="${x + bw * 0.12}" y="${y(planned[i])}" width="${bw * 0.76}" height="${ih - (y(planned[i]) - m.t)}" rx="1.5"><title>Week ${c}: ${fmtKm(planned[i])} km planned</title></rect>`;
    if (done[i] > 0) s += `<rect class="b-done" x="${x + bw * 0.3}" y="${y(done[i])}" width="${bw * 0.4}" height="${ih - (y(done[i]) - m.t)}" rx="1.5"><title>Week ${c}: ${fmtKm(done[i])} km run</title></rect>`;
    if (c === 1 || c % 4 === 0 || c === cats.length) s += `<text class="ax" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${c}</text>`;
  });
  if (opts.line) {
    let d = '';
    cats.forEach((c, i) => { const x = m.l + i * bw + bw / 2; d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y(planned[i]).toFixed(1); });
    s += `<path class="l-plan" d="${d}"/>`;
    cats.forEach((c, i) => { const x = m.l + i * bw + bw / 2; s += `<circle class="p-plan" cx="${x}" cy="${y(planned[i])}" r="2"><title>Week ${c}: ${fmtKm(planned[i])} km planned</title></circle>`; });
  }
  const cw = cur => cur >= 1 && cur <= cats.length ? `<line class="nowline" x1="${m.l + (cur - 0.5) * bw}" x2="${m.l + (cur - 0.5) * bw}" y1="${m.t}" y2="${m.t + ih}"/>` : '';
  s += cw(weekNo(today()));
  s += `<text class="ax" x="${m.l}" y="${H - 8}" text-anchor="start" dx="-30">Wk</text>`;
  el.innerHTML = svgWrap(W, H, s, label);
}

function timeChart(el, series, label, o = {}) {
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) return emptyChart(el, o.empty || 'Nothing logged yet.');
  const W = Math.max(280, el.clientWidth), H = o.h || 200, m = { l: 42, r: 10, t: 12, b: 24 };
  let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
  if (o.xmin != null) x0 = Math.min(x0, o.xmin); if (o.xmax != null) x1 = Math.max(x1, o.xmax);
  if (x1 - x0 < 864e5 * 14) { x0 -= 864e5 * 7; x1 += 864e5 * 7; }
  let y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));
  if (o.y0 != null) y0 = Math.min(y0, o.y0);
  const pad = (y1 - y0) * 0.1 || 1; y0 -= pad; y1 += pad;
  const yt = niceTicks(y0, y1, 4); y0 = yt[0]; y1 = yt[yt.length - 1];
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = v => m.l + (v - x0) / (x1 - x0) * iw;
  const Y = v => o.invert ? m.t + (v - y0) / (y1 - y0) * ih : m.t + ih - (v - y0) / (y1 - y0) * ih;
  let s = '';
  for (const v of yt) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${o.yfmt ? o.yfmt(v) : v}</text>`;
  // month ticks
  const d0 = new Date(x0), months = [];
  let d = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
  while (d.getTime() <= x1) { months.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  const every = Math.ceil(months.length / Math.max(2, Math.floor(iw / 56)));
  months.forEach((mo, i) => {
    if (i % every) return;
    const x = X(mo.getTime());
    s += `<line class="tick" x1="${x}" x2="${x}" y1="${m.t + ih}" y2="${m.t + ih + 4}"/><text class="ax" x="${x}" y="${H - 6}" text-anchor="middle">${MON[mo.getMonth()]}${mo.getMonth() === 0 ? ' ' + String(mo.getFullYear()).slice(2) : ''}</text>`;
  });
  const tn = parseISO(today()).getTime();
  if (tn >= x0 && tn <= x1) s += `<line class="nowline" x1="${X(tn)}" x2="${X(tn)}" y1="${m.t}" y2="${m.t + ih}"/><text class="ax now" x="${X(tn) + 3}" y="${m.t + 9}">today</text>`;
  for (const se of series) {
    const sp = se.pts.slice().sort((a, b) => a[0] - b[0]);
    if (se.line && sp.length > 1) s += `<path class="${se.cls}-l" d="${sp.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}"/>`;
    if (se.dots !== false) for (const p of sp) s += `<circle class="${se.cls}-p" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${se.r || 3.2}"><title>${esc(p[2] || '')}</title></circle>`;
  }
  if (o.lastLabel) {
    const se = series.find(x => x.cls === o.lastLabel); const sp = se && se.pts.slice().sort((a, b) => a[0] - b[0]);
    if (sp && sp.length) { const p = sp[sp.length - 1]; s += `<text class="lbl" x="${Math.min(X(p[0]) + 6, W - m.r - 40)}" y="${Y(p[1]) - 7}">${o.yfmt ? o.yfmt(p[1]) : p[1]}</text>`; }
  }
  el.innerHTML = svgWrap(W, H, s, label);
}

function drawCharts() {
  const cats = PLAN.map((_, i) => i + 1);
  const el1 = $('#ch-week'); if (el1) barChart(el1, cats, cats.map(weekKmPlanned), cats.map(weekKmDone), 'Weekly distance, planned and run');
  const el2 = $('#ch-long');
  if (el2) {
    const longDone = cats.map(w => { let m = 0; for (const s of weekSessions(w)) { const l = sessionLog(s); const k = num(l && l.run && l.run.km); if (k > m) m = k; } return m; });
    barChart(el2, cats, cats.map(w => PLAN[w - 1][4]), longDone, 'Long run per week, planned and run', { line: true });
  }
  const el3 = $('#ch-str');
  if (el3) {
    const id = ui.chartEx, ex = EXERCISES[id], hist = exHistory(id);
    if (!hist.length) emptyChart(el3, `Log your first ${ex.name.toLowerCase()} session and your goal line appears here, rising toward race day.`);
    else {
      const base = baseOf(ex, hist);
      const goal = [];
      for (let d = base.date; d <= RACE_DATE; d = addDays(d, 7)) goal.push([parseISO(d).getTime(), plannedValue(ex, base, d), `Goal ${fmtD(d)}: ${plannedValue(ex, base, d)}`]);
      const unit = ex.kind === 'weight' ? ' ' + UNIT() : ex.kind === 'time' ? ' s' : ' reps';
      const act = hist.map(h => { const t = topOf(ex, h); const v = ex.kind === 'weight' ? t.w : t.v; return [parseISO(h.date).getTime(), v, `${fmtD(h.date)}: ${ex.kind === 'weight' ? `${t.r} × ${t.w}${unit}` : v + unit}`]; });
      timeChart(el3, [{ pts: goal, cls: 'gl', line: true, dots: false }, { pts: act, cls: 'ac', line: true }], `${ex.name}: goal and best set`, { yfmt: v => v + (ex.kind === 'weight' ? '' : ''), lastLabel: 'ac' });
    }
  }
  const el4 = $('#ch-pace');
  if (el4) {
    const runs = allRuns().filter(r => r.sec > 0 && r.km > 0);
    const P = r => [parseISO(r.date).getTime(), r.sec / r.km / 60, `${fmtD(r.date)} ${parseISO(r.date).getFullYear()}: ${fmtKm(r.km)} km in ${fmtDur(r.sec)} · ${fmtPace(r.sec / r.km)} /km`];
    timeChart(el4, [{ pts: runs.filter(r => r.src === 'past').map(P), cls: 'pa', r: 2.6 }, { pts: runs.filter(r => r.src === 'plan').map(P), cls: 'ac' }], 'Running pace over time', { invert: true, yfmt: v => fmtPace(v * 60), xmax: parseISO(RACE_DATE).getTime() });
  }
  const el5 = $('#ch-bw');
  if (el5) {
    const st = settings();
    const goal = [];
    for (let d = st.wStartDate; d <= RACE_DATE; d = addDays(d, 7)) goal.push([parseISO(d).getTime(), weightGoalAt(d), `Goal ${fmtD(d)}: ${weightGoalAt(d)} ${UNIT()}`]);
    goal.push([parseISO(RACE_DATE).getTime(), st.wGoal, `Race day goal: ${st.wGoal} ${UNIT()}`]);
    const pts = weightLog().map(p => [parseISO(p.date).getTime(), p.v, `${fmtDY(p.date)}: ${p.v} ${UNIT()}`]);
    timeChart(el5, [{ pts: goal, cls: 'gl', line: true, dots: false }, { pts, cls: 'ac', line: true }], 'Body weight against the goal', { lastLabel: pts.length ? 'ac' : null });
  }
}

/* ===== Moves (library) ===== */
function viewMoves() {
  let h = `<section class="head"><h1>Exercises & stretches</h1><p class="muted">Tap any figure for form cues and a link to demo videos.</p></section>`;
  for (const g of ['A', 'B']) {
    h += `<h2 class="phase">Strength ${g} <span class="muted">${g === 'A' ? 'after Run 1 · legs, hamstrings, calves, core, back' : 'after Run 2 · knees, ankles, balance, upper body'}</span></h2><div class="mgrid">`;
    for (const id of GROUPS[g].filter(i => g === 'A' || EXERCISES[i].group !== 'AB')) { const ex = EXERCISES[id]; h += moveCard(id, ex.name, `${ex.sets} sets · ${ex.kind === 'weight' ? ex.reps + ' reps' : ex.kind === 'time' ? 'timed' : 'reps'}${ex.perSide ? ' each side' : ''} · ≈${kc(exBurn(id, today(), kgOn(today())))} kcal`, ex.cue); }
    h += `</div>`;
  }
  const areas = ['Hips', 'Ankles', 'Knees & legs', 'Full body'];
  h += `<h2 class="phase">Stretch routine <span class="muted">Quick 6 after every run · all ${STRETCH_FULL.length} after the long run</span></h2>`;
  for (const a of areas) {
    h += `<h3 class="sub">${a}</h3><div class="mgrid">`;
    for (const id of STRETCH_FULL.filter(i => STRETCHES[i].area === a)) { const x = STRETCHES[id]; h += moveCard(id, x.name, x.dose + (STRETCH_QUICK.includes(id) ? ' · in quick routine' : ''), x.cue); }
    h += `</div>`;
  }
  return h;
}
function moveCard(id, name, meta, cue) {
  return `<article class="mcard"><button class="m-fig" data-act="move" data-id="${id}" aria-label="Open ${esc(name)}">${figHTML(id)}</button>
    <div class="m-t"><b>${esc(name)}</b><span class="muted">${esc(meta)}</span><p>${esc(cue)}</p>
    <a class="vid" href="${ytLink((EXERCISES[id] || STRETCHES[id]).q)}" target="_blank" rel="noopener">Watch demo videos ↗</a></div></article>`;
}

/* ===== Log (history) ===== */
function viewLog() {
  const runs = allRuns().slice().reverse();
  const hist = history();
  const meas = hist.filter(h => h.wt || h.pullups || h.situps);
  let h = `<section class="head"><h1>Run log</h1><p class="muted">Every run: your past treadmill runs plus everything you log in the plan. Newest first.</p></section>
  <section class="card"><h2>Add a past entry</h2>
    <form class="addh" id="addh">
      <label class="fld"><span>Date</span><input type="date" id="ah-d" name="d" value="${today()}" required></label>
      <label class="fld"><span>Distance (km)</span><input id="ah-km" name="km" inputmode="decimal" placeholder="3.0"></label>

      <label class="fld"><span>Max HR</span><input id="ah-hr" name="hr" inputmode="numeric" placeholder="bpm"></label>
      <label class="fld"><span>Weight (${UNIT()})</span><input id="ah-wt" name="wt" inputmode="decimal" placeholder="optional"></label>
      <label class="fld wide"><span>Note</span><input id="ah-n" name="n" placeholder="optional"></label>
      <button class="btn sm" type="submit">Add entry</button>
    </form></section>
  <div class="tbl-wrap card"><table class="runs"><thead><tr><th>Date</th><th>km</th><th>Time</th><th>Pace /km</th><th>km/h</th><th>Max HR</th><th>Notes</th><th></th></tr></thead><tbody>`;
  for (const r of runs) {
    const pace = r.sec > 0 ? r.sec / r.km : NaN;
    h += `<tr class="${r.src}"><td>${fmtDY(r.date)}</td><td class="num">${fmtKm(r.km)}</td><td class="num">${fmtDur(r.sec)}</td><td class="num">${fmtPace(pace)}</td><td class="num">${pace > 0 ? (3600 / pace).toFixed(2) : '–'}</td><td class="num">${r.maxHr > 0 ? r.maxHr : ''}</td>
      <td>${r.src === 'plan' ? '<span class="pill easy">Plan</span> ' : ''}${esc(r.note || '')}</td>
      <td>${r.src === 'past' ? `<button class="icon-btn sm" data-act="delh" data-d="${r.date}" data-km="${r.km}" aria-label="Delete this entry">${ICON.x}</button>` : `<button class="link-btn" data-act="goto" data-d="${r.date}">Open</button>`}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  if (meas.length) {
    h += `<section class="card"><h2>Body & strength notes</h2><table class="runs"><thead><tr><th>Date</th><th>Weight</th><th>Pull-ups</th><th>Sit-ups</th></tr></thead><tbody>`;
    for (const m of meas.slice().reverse()) h += `<tr><td>${fmtDY(m.d)}</td><td class="num">${m.wt ? m.wt + ' lb' : ''}</td><td class="num">${m.pullups || ''}</td><td class="num">${esc(m.situps || '')}</td></tr>`;
    h += `</tbody></table></section>`;
  }
  return h;
}

/* ===== sheets (move detail, settings, confirm) ===== */
function syncBanner() {
  if (window.MT_PWA) {
    let started = false; try { started = localStorage.getItem('marathon-build:started') === '1'; } catch (e) { }
    if (started || Object.keys(Store.docs).length) return '';
    return `<section class="card welcome"><span class="eyebrow">Welcome</span><h2>Bring over your plan</h2>
      <p>Load the plan file you saved (for example from Files or iCloud Drive) to bring your settings, workouts and food log into this app. Everything then stays on this iPhone and works offline.</p>
      <div class="row"><label class="btn filebtn">Load plan file<input type="file" id="imp" accept=".json,application/json"></label>
      <button class="btn ghost" data-act="pwa-fresh">Start fresh</button></div></section>`;
  }
  if (Store.connecting) return `<div class="syncbar loading" role="status"><span class="spin" aria-hidden="true"></span><span><b>Loading your plan…</b> Getting your latest data from your Claude account.</span></div>`;
  if (Store.mode === 'local' && Store.connectDone) {
    const inClaude = !!(window.claude && typeof window.claude.use === 'function');
    return `<div class="syncbar off" role="status"><span><b>Not synced.</b> ${inClaude ? 'This page can\u2019t reach your synced plan, so it shows only what was saved on this device. Open your tracker while signed in to Claude.' : 'This is the offline copy; it keeps its own data on this computer. Your synced plan lives in the online tracker.'}</span>
      <a class="btn sm" href="${MAIN_URL}" target="_blank" rel="noopener">Open my synced tracker</a></div>`;
  }
  return '';
}
function renderSheet() {
  const el = $('#sheet');
  if (!ui.sheet) { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('locked'); return; }
  el.hidden = false; document.body.classList.add('locked');
  let inner = '';
  if (ui.sheet.type === 'move') inner = moveGuideHTML(ui.sheet.id);
  else if (ui.sheet.type === 'settings') inner = settingsHTML();
  else if (ui.sheet.type === 'savefile') {
    const st = settings(), base = st.planFileName || 'Marathon plan';
    const picker = PlanFile.supported(), share = window.MT_PWA || /iPhone|iPad/.test(navigator.userAgent);
    inner = `<h2>Save plan file</h2>
      <label class="fld"><span>File name</span><input id="sf-name" type="text" autocomplete="off" value="${esc(base)}" placeholder="Marathon plan"></label>
      <label class="chk"><input type="checkbox" id="sf-date" ${st.planFileDate ? 'checked' : ''}> Add today's date to the name (keeps older copies)</label>
      <p class="muted small">Saved as <b id="sf-prev">${esc(base)}${st.planFileDate ? ' ' + today() : ''}.json</b>. ${picker ? 'Next you choose the folder. To overwrite your last copy, pick the same folder and name and confirm Replace.' : share ? 'Next tap <b>Save to Files</b>, choose the folder (for example iCloud Drive), then Save. Keep the same name and tap <b>Replace</b> to overwrite your last copy.' : 'Your browser then asks where to save it, or puts it in Downloads.'}</p>
      <div class="row"><button class="btn" data-act="savefile-go">${picker || share ? 'Choose folder and save' : 'Save'}</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
  }
  else if (ui.sheet.type === 'confirm') inner = `<h2>${esc(ui.sheet.title)}</h2><p>${esc(ui.sheet.body)}</p><div class="row"><button class="btn danger" data-act="confirm-yes">${esc(ui.sheet.yes)}</button><button class="btn ghost" data-act="close">Cancel</button></div>`;
  if (ui.sheet.type === 'settings') setTimeout(async () => { const b = document.getElementById('snap-box'); if (b) b.innerHTML = await snapsHTML(); }, 0);
  el.innerHTML = `<div class="sh-back" data-act="close"></div><div class="sh-card" role="dialog" aria-modal="true"><button class="icon-btn sh-x" data-act="close" aria-label="Close">${ICON.x}</button>${inner}</div>`;

function markSaved(filename) { if (/\.json$/.test(filename)) { try { localStorage.setItem(FKEY, new Date().toISOString()); } catch (e) { } const b = document.querySelector('.syncbar.backup'); if (b) b.remove(); } }
async function saveFile(filename, data, mime) {
  if (PlanFile.supported()) {
    try {
      const ext = filename.split('.').pop();
      const h = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: ext === 'html' ? 'Web page' : 'Marathon plan', accept: { [mime]: ['.' + ext] } }] });
      const w = await h.createWritable(); await w.write(data); await w.close(); markSaved(filename); toast('Saved ' + h.name); return;

      catch (e) { if (e && e.code !== 'declined') toast('Couldn\u2019t save the file here. Try again from the Claude app or claude.ai.'); }
      return;

  }
  try {

function onChange(e) {
  const el = e.target;
  if (el.id === 'chart-ex') { ui.chartEx = el.value; drawCharts(); return; }
  if (el.id === 'food-sort') { ui.fsort = el.value; const box = $('#food-list'); if (box) box.innerHTML = foodListHTML(today()); return; }
  if (el.dataset && el.dataset.swapKey) {
    const map = Object.assign({}, swaps());
    if (el.value === 'plan') delete map[el.dataset.swapKey]; else map[el.dataset.swapKey] = el.value;
    Store.put('app/swaps', { map });
    toast(el.value === 'plan' ? 'Back to the planned workout' : 'Changed for this day only'); render(); return;
  }
  if (el.dataset && el.dataset.moveKey) {
    if (el.value === el.dataset.from) return;
    moveSession(el.dataset.moveKey, el.dataset.from, el.value, el.dataset.def);
    if (ui.tab === 'train') ui.day = el.value;
    toast(el.value === el.dataset.def ? `Back on its usual day, ${fmtD(el.value)}` : `Moved to ${fmtD(el.value)} for this week only`); render(); return;
  }
  if (el.dataset && el.dataset.set) {
    const key = el.dataset.set;
    let v;
    if (key === 'sex') v = el.value;
    else if (key === 'heightCm') { v = parseHeight(el.value); if (!(v > 0)) { toast('Enter height like 5\'10" or 178 cm.'); return; } }
    else if (key === 'backupEvery') v = +el.value;
    else { v = num(el.value); if (!(v > 0) && !/^(r1|r2|long)$/.test(key)) { toast('Enter a number.'); return; } }
    if (/^(r1|r2|long)$/.test(key)) {
      const w0 = Math.max(1, weekNo(today())), d0 = Object.assign({}, daysFor(w0)); d0[key] = +el.value;
      setDefaultDays(w0, d0); toast(`Usual days updated from week ${w0} on`); render(); return;
    }
    const cur = Object.assign({}, Store.get('app/settings') || {}); cur[key] = v;
    Store.put('app/settings', cur); toast(/^w/.test(key) ? 'Weight goal updated' : /^(age|heightCm|sex)$/.test(key) ? 'Calorie targets updated' : 'Training days updated'); render(); return;
  }
  if (el.id === 'imp' && el.files && el.files[0]) {
    const fr = new FileReader(); fr.onload = () => importBackup(String(fr.result)); fr.readAsText(el.files[0]); el.value = '';
  }
}
function onSubmit(e) {
  const f = e.target;
  if (f.id === 'cform') {
    e.preventDefault();
    const kcal = num(f.kcal.value); if (!(kcal >= 0) || !f.name.value.trim()) { toast('Enter a name and calories.'); return; }
    const v = k => { const x = num(f[k].value); return x > 0 ? x : 0; };
    const item = { name: f.name.value.trim(), serving: f.serving.value.trim() || '1 serving', kcal: Math.round(kcal), protein: v('protein'), carbs: v('carbs'), sugar: v('sugar'), fat: v('fat'), fibre: v('fibre'), na: v('na') };
    const d = ui.foodDay || today();
    if (f.save.checked) { const id = 'my-' + Date.now().toString(36); Store.put('app/myfoods', { items: myFoods().concat([Object.assign({ id }, item)]) }); addCustomEntry(d, Object.assign({ id }, item)); }
    else addCustomEntry(d, item);
    toast(`Added ${item.name} (${item.kcal} kcal)`); render(); return;
  }
  if (f.classList.contains('dd-form')) {
    e.preventDefault();
    const w = +f.dataset.w, days = { r1: +f.r1.value, r2: +f.r2.value, long: +f.long.value };
    if (new Set([days.r1, days.r2, days.long]).size < 3) { toast('Pick three different days.'); return; }
    setDefaultDays(w, days);
    toast(`Usual days updated from week ${w} on`); render(); return;
  }
  if (f.classList.contains('addx')) {
    e.preventDefault();
    const d = f.d.value, t = f.t.value;
    const items = extras().concat([{ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: d, type: t }]);
    Store.put('app/extras', { items });
    toast(`${EXTRA_TYPES[t].short} added to ${fmtD(d)}`);
    render();
  }
  if (f.id === 'addh') {
    e.preventDefault();
    const km = num(f.km.value), sec = parseTime(f.t.value);
    if (!(km > 0) && !(num(f.wt.value) > 0)) { toast('Enter a distance or a body weight.'); return; }
    const entry = { d: f.d.value };
    if (km > 0) { entry.km = km; if (sec > 0) entry.t = fmtDur(sec); }
    if (num(f.hr.value) > 0) entry.maxHr = num(f.hr.value);
    if (num(f.wt.value) > 0) entry.wt = num(f.wt.value);
    if (f.n.value.trim()) entry.note = f.n.value.trim();
    const list = history().concat([entry]).sort((a, b) => a.d < b.d ? -1 : 1);
    Store.put('app/history', { entries: list });
    toast('Entry added'); render();
  }
}

/* ---------- icons ---------- */
const ICON = {
  left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* ---------- boot ---------- */
function boot() {
  Store.loadLocal();
  const v = $('#view');
  v.addEventListener('input', onInput);
  $('#sheet').addEventListener('input', onInput);
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('submit', onSubmit);
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { flushPending(); ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
  $('#gear').addEventListener('click', () => { ui.sheet = { type: 'settings' }; renderSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; renderSheet(); } });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (ui.tab === 'progress') drawCharts(); }, 150); });
  window.addEventListener('pagehide', flushPending);
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushPending(); return; }
    // back in the app: pick up the newest data and today's date
    if (Store.db && Store.dead && Store.subscribe) { Store.dead = false; Store.subscribe(); }
    if (today() !== lastDay) { lastDay = today(); if (ui.tab === 'train') ui.day = null; render(); }
    PlanFile.sync(false);
  });
  // re-render when another device changes the data, but never while typing
  let dirty = false;
  Store.onChange = force => {
    if (force) { render(); return; }
    const ae = document.activeElement;
    if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.closest('#view, #sheet')) { dirty = true; return; }
    render();
  };
  document.addEventListener('focusout', () => setTimeout(() => { const ae = document.activeElement; if (dirty && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) { dirty = false; render(); } }, 50));
  setSync('local');
  render();
  Store.connect();
  PlanFile.init();
  // autosave on open: a restore point once the plan is loaded
  const snapOpen = () => { if (Store.connecting) return setTimeout(snapOpen, 1000); Snaps.take('App opened'); };
  setTimeout(snapOpen, 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(() => Snaps.take('App opened'), 1500); });
  if (window.MT_PWA) {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('App updated. Close and reopen it to use the new version.'); }); });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
      }).catch(() => { });
    }
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
window.__MT = { Store, target, plannedSessions, weekSessions, testMovedFrom, exHistory, ui, render, coach, coachCard, dayFuel }; window.__PF = PlanFile;
})();

</script>
