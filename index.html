<style data-app>
/* Layout: phone-first training log — sticky header, one column of day cards, tab bar at the thumb; wide screens get top tabs and two-column cards */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#f5f7f9; --ink:#14202b; --muted:#5d6b78; --line:#d9e0e6;
  --accent:#1f4fbf; --accent-soft:#e3ebfb; --bib:#d9622b; --bib-soft:#fbe9df;
  --good:#1e7f55; --warn:#a56a12; --bad:#b4372f; --fig-far:#a9b6c2; --prop:#5f86d6; --body:#273746; --work:#e2672f; --fig-bg:#ffffff;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#172029; --sunk:#121a21; --ink:#e6edf3; --muted:#93a2af; --line:#2a3743;
  --accent:#86a8ff; --accent-soft:#1d2a47; --bib:#ff935c; --bib-soft:#3a2418;
  --good:#4cc38a; --warn:#e2a948; --bad:#ff7a70; --fig-far:#4f5e6c; --prop:#7d9fe8; --body:#d3dde6; --work:#ff8a4c; --fig-bg:#172029; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#172029; --sunk:#121a21; --ink:#e6edf3; --muted:#93a2af; --line:#2a3743;
  --accent:#86a8ff; --accent-soft:#1d2a47; --bib:#ff935c; --bib-soft:#3a2418;
  --good:#4cc38a; --warn:#e2a948; --bad:#ff7a70; --fig-far:#4f5e6c; --prop:#7d9fe8; --body:#d3dde6; --work:#ff8a4c; --fig-bg:#172029; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-disp);letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.welcome{display:flex;flex-direction:column;gap:8px;border-color:var(--accent)}
.welcome p{margin:0}
.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.syncbar span{flex:1;min-width:200px}
.syncbar.off{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.syncbar.loading{border-color:var(--accent)}
.spin{flex:none!important;min-width:0!important;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.syncbar.backup{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.snaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.snaps li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.snaps li:last-child{border-bottom:0}
.snaps li>div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px}
.snaps .muted{font-size:12px}
.pf{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);margin-bottom:8px;font-size:14px;overflow-wrap:anywhere}
.pf.warn{border-color:var(--warn)}
.home-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.home-box{display:flex;gap:12px;align-items:center}
.home-box img{width:56px;height:56px;border-radius:13px;flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12.5px;color:var(--muted)}
.brand span b{font-family:var(--f-body);font-size:12.5px;color:var(--bib);font-weight:700}
#sync{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
#sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
#sync[data-state="ok"]::before{background:var(--good)}
#sync[data-state="err"]::before{background:var(--bad)}
#sync[data-state="wait"]::before{background:var(--warn)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:16px;height:16px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  body{padding-bottom:32px}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0;z-index:19}
  .tabs .wrap{display:flex;gap:4px;height:48px}
  .tab{flex-direction:row;font-size:14px;gap:8px;padding:0 14px;border-bottom:2.5px solid transparent}
  .tab svg{width:19px;height:19px}
  .tab[aria-current="page"]{border-bottom-color:var(--accent)}
}

main.wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.slim{padding:12px 16px}
.card.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#0e141a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#0e141a}}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* fields */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);font-size:16px}
.fld textarea{resize:vertical;min-height:60px}
.fld.inline{flex-direction:row;align-items:center;gap:10px;margin:6px 0}
.fld.inline select{width:auto;flex:1;max-width:320px}
.grid2,.grid3,.grid4{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.grid4{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.grid3{grid-template-columns:1fr}}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.pill.easy{background:var(--accent-soft);color:var(--accent)}
.pill.quality{background:var(--bib-soft);color:var(--bib)}
.pill.long{background:var(--accent);color:var(--surface)}
.pill.race{background:var(--bib);color:var(--surface)}
.pill.extra{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.pill.test{background:var(--bib-soft);color:var(--bib);margin-left:8px}
.pill.rec{background:var(--sunk);color:var(--good)}
.pill.chg{background:var(--bib-soft);color:var(--bib);margin-left:6px}
.s-head>.dn-seg{flex:none;flex-direction:row;gap:0;align-items:stretch}
.dn-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--sunk)}
.dn-seg button{border:0;background:none;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.dn-seg button+button{border-left:1px solid var(--line)}
.dn-seg button.on.yes{background:var(--good);color:#fff}
.dn-seg button.on.no{background:var(--bad);color:#fff}
.nd-note p{margin:0;font-size:14px;color:var(--bad)}
.st-btns{display:flex;gap:6px;flex:none;margin-left:auto}
.stb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.stb.yes.on{background:var(--good);border-color:var(--good);color:#fff}
.stb.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.st.off{border-color:var(--bad);background:var(--sunk)}
.st.off .st-t b{color:var(--muted)}
@media (max-width:520px){.s-head{flex-wrap:wrap}.s-head>.dn-seg{order:3;width:100%}.dn-seg button{flex:1}}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:10px;background:var(--sunk)}
.adjust select{min-height:40px;background:var(--surface)}
@media (max-width:520px){.adjust{grid-template-columns:1fr}}
.dot.notdone{background:var(--bad);border-color:var(--bad)}
.dot.skip{background:var(--line);border-color:var(--line)}
.pill.now{background:var(--accent-soft);color:var(--accent)}

/* train */
.daybar{display:flex;align-items:center;gap:10px}
.daytitle{flex:1;min-width:0;text-align:center}
.daytitle h1{font-size:28px}
.jump{text-align:center;margin-top:-8px}
.session{display:flex;flex-direction:column;gap:14px}
.s-head{display:flex;align-items:flex-start;gap:10px}
.s-head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.s-head h2{font-size:24px}
.done-tog{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);white-space:nowrap}
.done-tog input{width:18px;height:18px;accent-color:var(--good);margin:0}
.done-tog:has(input:checked){border-color:var(--good);color:var(--good)}
.block{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:19px}
.bh .muted{font-family:var(--f-body);font-size:13px;font-weight:500}
.bh .link-btn{margin-left:auto}
.target{display:flex;gap:14px;align-items:center}
.big{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.paceline{font-size:14px;font-variant-numeric:tabular-nums}
.ex{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0;padding-top:0}
.ex-fig,.st-fig,.m-fig{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:0;cursor:pointer;display:block}
.ex-fig{width:92px;height:62px;align-self:start}
.ex-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.ex-top{display:flex;align-items:center;flex-wrap:wrap}
.ex-body{position:relative}.ex-body>.ex-top{padding-right:40px}
.exx{position:absolute;top:-2px;right:0;width:30px;height:30px;font-size:13px}
.ex-off{opacity:.75}.ex-off .ex-top b{text-decoration:line-through}
.moved{display:inline-block;margin:4px 0 2px;padding:3px 8px;border-radius:7px;background:var(--bib-soft);color:var(--bib);font-size:12.5px;font-weight:600}
.ex-tgt{font-size:14px;color:var(--muted)}
.ex-acts{display:flex;gap:16px}
.sore{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer;max-width:420px}
.sore input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--bib);flex:none}
.sore span{color:var(--muted)}
.sore b{color:var(--ink);font-weight:600}
.sore:has(input:checked){border-color:var(--bib)}
table.sets{border-collapse:collapse;width:100%;max-width:360px;font-variant-numeric:tabular-nums}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:2px 6px 4px 0}
.sets td{padding:3px 6px 3px 0;font-size:14px}
.sets td:first-child{width:34px;color:var(--muted)}
.setin{width:100%;max-width:84px;min-height:38px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:16px;text-align:center}
.stlist{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:600px){.stlist{grid-template-columns:1fr 1fr}}
.st{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.st input{width:20px;height:20px;accent-color:var(--good);flex:none;margin:0}
.st.on{background:var(--sunk);border-color:var(--good)}
.st.on .st-t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--good)}
.st{cursor:default}
.st-fig{width:66px;height:44px;flex:none}
.st-t{display:flex;flex-direction:column;min-width:0;font-size:14px}
.st-t .muted{font-size:12.5px}
.daymeta{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.daymeta .fld{width:160px}
.notes textarea{min-height:52px}

/* coach */
.coach{border-color:var(--bib);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.coach h2{font-size:22px}
.coach p{margin:0;font-size:14.5px}
/* week summary */
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wsum.compact{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.wsum.compact{grid-template-columns:repeat(2,1fr)}}
.wsum>div{display:flex;flex-direction:column;gap:1px;background:var(--sunk);border-radius:9px;padding:8px 10px;min-width:0}
.wsum b{font-family:var(--f-disp);font-size:22px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.wsum b small{font-size:13px;color:var(--muted);font-weight:600}
.wsum b.good{color:var(--good)}
.wsum b.bad{color:var(--bad)}
.wsum span{font-size:12px;color:var(--muted)}
.wk-sum{padding:12px 14px;border-bottom:1px solid var(--line)}
.wbw{display:flex;flex-direction:column;gap:12px}
.wbw-row{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.wbw-row:first-child{border-top:0;padding-top:0}
.wbw-h{display:flex;gap:8px;align-items:baseline}
.defdays{padding:10px 14px;border-bottom:1px solid var(--line)}
.defdays summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.dd-form{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end;margin-top:10px}
@media (max-width:560px){.dd-form{grid-template-columns:1fr 1fr 1fr}.dd-form .btn{grid-column:1/-1}}
/* food diary */
.diary{display:flex;flex-direction:column;gap:12px}
.d-top{display:flex;align-items:center;gap:10px}
.d-top>div{flex:1;text-align:center;display:flex;flex-direction:column;gap:2px}
.d-top .icon-btn:disabled{opacity:.35}
.dleft{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dleft b{font-family:var(--f-disp);font-size:46px;font-weight:700;line-height:.9;color:var(--good);font-variant-numeric:tabular-nums}
.dleft.over b{color:var(--bad)}
.dleft span{font-size:13.5px;color:var(--muted)}
.dleft .link-btn{padding:0;font-size:13.5px}
.dbars{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.dbars{grid-template-columns:1fr 1fr}}
.dbar{display:flex;flex-direction:column;gap:4px}
.dbar-t{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.dbar-t span{color:var(--muted);font-variant-numeric:tabular-nums}
.dbar-t em{margin-left:auto;font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.dbar i{display:block;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.dbar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:4px;background:var(--accent)}
.dbar.limit i::after{background:var(--warn)}
.dbar.over em{color:var(--bad)}
.dbar.over i::after{background:var(--bad)}
.dbar.goal:not(.over) em{color:var(--muted)}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dlist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.dl-n{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.dl-n .muted{font-size:12.5px}
.custom summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14.5px}
.cform{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media (min-width:600px){.cform{grid-template-columns:repeat(4,1fr)}}
.cform .wide{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.other{max-width:300px}
.diary.compact{border-top:1px solid var(--line);padding-top:10px}
.diary.compact .dleft b{font-size:34px}
/* food guide */
.food-tools{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;background:var(--bg);padding-block:8px}
@media (min-width:900px){.food-tools{top:calc(env(safe-area-inset-top,0px) + 109px)}}
.food-q input{font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sortsel{margin:0}
.food-cat{margin-top:6px}
.foods{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:760px){.foods{grid-template-columns:1fr 1fr}}
.food{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.food.is-h{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.food-h{display:flex;gap:10px;align-items:flex-start}
.food-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.food-n .muted{font-size:12.5px}
.food-n .pill{align-self:flex-start;margin-top:3px}
.pill.hp{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.food-k{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.food-k b{font-family:var(--f-disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.food-k span{font-size:11px;color:var(--muted)}
.addf{flex:none;min-height:34px}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;margin:0}
.nut div{display:flex;flex-direction:column;background:var(--sunk);border-radius:7px;padding:5px 7px}
.nut dt{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nut dd{margin:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.nut .warn dd{color:var(--bad)}
.addins{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip.sm{padding:5px 10px;font-size:12.5px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;min-width:0}
.stp>span{min-width:0;color:var(--muted)}
.stp-c{display:flex;align-items:center;gap:6px;flex:none}
.stp-c b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.stp-c .icon-btn{width:30px;height:30px;font-size:17px;font-weight:600;line-height:1}
.stp-c .icon-btn:disabled{opacity:.35;cursor:default}
.addins .small{margin:0}
.sizes{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 2px}
.sizes .chip{min-width:38px;text-align:center}
.addl{font-size:12.5px;font-weight:600;color:var(--bib)}
@media (max-width:460px){.steppers{grid-template-columns:1fr}}
.eaten{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.eaten-h{display:flex;flex-direction:column;gap:2px;font-size:14px}
.eaten-h .muted{font-size:12.5px}
.eaten ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.eaten li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.eaten li span:first-child{flex:1;min-width:0}
.eaten-empty .link-btn{padding:0;font-size:13px}
/* fuel */
.fuel{display:flex;flex-direction:column;gap:12px}
.fuel-top{display:flex;flex-direction:column;gap:6px}
.kcal{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.kcal b{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:.9;color:var(--good);font-variant-numeric:tabular-nums}
.kcal span,.burn span{font-size:13px;color:var(--muted)}
.burn{display:flex;align-items:baseline;gap:6px}
.burn b{font-family:var(--f-disp);font-size:26px;font-weight:700;color:var(--bib);line-height:1;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac{display:flex;flex-direction:column;gap:3px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.mac span{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mac b{font-size:18px;font-variant-numeric:tabular-nums}
.mac i{display:block;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.mac i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:3px;background:var(--accent)}
.mac.c i::after{background:var(--good)}
.mac.f i::after{background:var(--warn)}
.fuel-notes{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.fuel-notes b{color:var(--ink);font-weight:600}
.fuel-log{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.fuel-log .fld{width:170px}
.fuel-log .muted{font-size:13.5px;padding-bottom:10px}
.kc{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--bib);white-space:nowrap;padding-left:8px}
.kc-line{font-size:13px;color:var(--bib);font-weight:600}

/* plan */
.phase{font-size:24px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.phase .muted{font-family:var(--f-body);font-size:13px;font-weight:500;letter-spacing:0}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week.cur{border-color:var(--accent)}
.wk-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer}
.wk-n{font-family:var(--f-disp);font-size:28px;font-weight:700;width:34px;color:var(--accent);font-variant-numeric:tabular-nums;flex:none;text-align:center}
.wk-mid{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.wk-mid b{font-weight:600}
.dots{display:flex;gap:5px;width:100%}
.wk-km{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wk-km b{color:var(--ink);font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.missed{border-color:var(--bad)}
.dot.today{border-color:var(--accent);background:var(--accent-soft)}
.wk-days{border-top:1px solid var(--line);display:flex;flex-direction:column}
.wk-day{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-right:12px}
.wk-day.is-moved{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.wd-open{flex:1;min-width:0;display:grid;grid-template-columns:14px 92px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:10px 4px 10px 14px;text-align:left;cursor:pointer}
.wd-open:hover{background:var(--sunk)}
.wd-move{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.wd-ml{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd-move select{min-height:34px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.wd-fixed{font-size:12px;font-weight:600;color:var(--muted);padding:0 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wk-warn{margin:0;padding:8px 14px;font-size:13px;color:var(--warn);background:var(--sunk);border-bottom:1px solid var(--line)}
.wk-reset{padding:8px 14px;border-bottom:1px solid var(--line)}
.wd-d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.wd-t{display:flex;flex-direction:column;min-width:0;font-size:14px}
.wd-t .muted{font-size:13px}
.wd-s{font-size:12px;font-weight:700;color:var(--muted)}
@media (max-width:480px){.wd-open{grid-template-columns:14px 1fr auto}.wd-d{grid-column:2}.wd-t{grid-column:2}.wd-s{grid-row:1;grid-column:3}}
.addx{display:grid;grid-template-columns:1fr 1.6fr auto;gap:10px;align-items:end;padding:12px 14px;background:var(--sunk)}
.addx-t{grid-column:1/-1;font-weight:600;font-size:14px}
@media (max-width:520px){.addx{grid-template-columns:1fr}}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-disp);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile b small{font-size:16px;color:var(--muted);font-weight:600}
.tile .muted{font-size:12.5px}
.chart-card{display:flex;flex-direction:column;gap:6px}
.chart{width:100%;min-height:190px;overflow:hidden}
.chart svg{display:block;max-width:100%}
.chart-empty{display:grid;place-items:center;text-align:center;min-height:150px;padding:20px;color:var(--muted);background:var(--sunk);border-radius:10px;font-size:14px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.sw.plan{background:var(--line)}
.sw.done{background:var(--bib)}
.sw.past{background:var(--fig-far);border-radius:50%;width:9px;height:9px}
.sw.line-plan{height:0;border-top:2.5px dashed var(--accent);border-radius:0}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{stroke:var(--muted)}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart .ax.now{fill:var(--accent);font-weight:600}
.chart .nowline{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.chart .b-plan{fill:var(--line)}
.chart .b-done{fill:var(--bib)}
.chart .l-plan,.chart .gl-l{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.chart .p-plan{fill:var(--accent)}
.chart .ac-l{fill:none;stroke:var(--bib);stroke-width:2.2}
.chart .ac-p{fill:var(--bib);stroke:var(--surface);stroke-width:1.5}
.chart .pa-p{fill:var(--fig-far);opacity:.9}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}

/* moves */
.sub{font-size:17px;margin-top:4px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.mgrid{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.mgrid{grid-template-columns:1fr 1fr 1fr}}
.mcard{display:grid;grid-template-columns:132px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.m-fig{width:132px;height:88px}
.m-t{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.m-t p{font-size:13px;margin:4px 0}
.m-t .muted{font-size:12.5px}
.vid{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none;margin-top:auto}

/* log */
.tbl-wrap{overflow-x:auto;padding:0}
table.runs{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
.runs th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);font-weight:600}
.runs td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.runs td.num{font-variant-numeric:tabular-nums;text-align:right}
.runs th:nth-child(n+2):nth-child(-n+6){text-align:right}
.runs tr.plan td:first-child{font-weight:600}
.card table.runs{min-width:0}
.addh{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:end}
@media (min-width:760px){.addh{grid-template-columns:repeat(6,1fr)}.addh .wide{grid-column:span 4}}
.addh .wide{grid-column:1/-1}

/* figures */
svg.fig{display:block;width:100%;height:100%}
.fig .bd.halo{fill:var(--fig-bg);stroke:var(--fig-bg);stroke-width:2.4;stroke-linejoin:round}
.fig .bd.body,.fig .bd.near{fill:var(--body)}
.fig .bd.far{fill:var(--fig-far)}
.fig .mu path,.fig .mu ellipse{fill:var(--work)}
.fig .mu.far path,.fig .mu.far ellipse{opacity:.6}
.fig .gnd{stroke:var(--line);stroke-width:1.5}
.fig .pr{stroke:var(--prop);stroke-width:2;fill:none;stroke-linecap:round}
.fig .pr.fill{fill:var(--prop)}
.fig .pr.thick{stroke-width:4}
.fig .pr.mat{fill:var(--accent-soft);stroke:none}
.fig .pr.wall{stroke-width:3}
.fig .strap{stroke:var(--bib);stroke-width:1.6}
.fig .pr.rope{stroke:var(--bib);stroke-width:1.8}
.ex-fig,.st-fig,.m-fig,.sh-fig,.step-fig{--fig-bg:var(--sunk)}
/* guide sheet */
.g-head{display:flex;flex-direction:column;gap:4px;padding-right:44px}
.g-mus{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:0}
.mdot{width:12px;height:12px;border-radius:50%;background:var(--work);flex:none;margin-top:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:600px){.steps{grid-template-columns:1fr 1fr}}
.step{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:8px}
.step-fig{position:relative;border-radius:8px;background:var(--sunk);aspect-ratio:200/130}
.step-n{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--surface);font:700 12px/22px var(--f-body);text-align:center}
.step-t{font-size:14px;min-width:0}
.step-t p{margin:2px 0 0;color:var(--muted)}
.avoid{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.avoid li{display:flex;gap:8px}
.avoid li::before{content:"\00d7";color:var(--bad);font-weight:700;font-size:18px;line-height:1}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40}
.sh-back{position:absolute;inset:0;background:rgba(10,16,22,.5)}
.sh-card{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.sh-card{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:16px}}
.sh-x{position:absolute;top:12px;right:12px}
.sh-fig{background:var(--sunk);border-radius:12px;border:1px solid var(--line);aspect-ratio:200/130;max-width:100%}
.tgtline{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:none;padding:8px 18px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--surface)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:50;max-width:min(92vw,460px);text-align:center}
@media (min-width:900px){#toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<main class="wrap" id="view" data-app></main>
<div id="sheet" hidden data-app></div>
<div id="toast" hidden role="status" data-app></div>
<script data-app>
/* ---------- Stick-figure animation engine ----------
   Side view, figure faces right (+x). Model coords: y up, ground y = 0.
   Angles in degrees, absolute.
   Limbs: angle measured from straight DOWN, positive rotates toward the front (+x).
   Torso t: measured from straight UP, positive leans forward.
*/
const FIG = (() => {
  const L = { torso: 34, neck: 4, head: 6.5, ua: 19, fa: 17, th: 28.5, sh: 27, ft: 8.5 };
  const R = Math.PI / 180;
  const down = (a, len) => [Math.sin(a * R) * len, -Math.cos(a * R) * len];
  const up = (a, len) => [Math.sin(a * R) * len, Math.cos(a * R) * len];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];

  const STAND = { t: 0, c: 0, h: 0, aN: [4, 8], aF: [-4, 4], lN: [2, 2, 90], lF: [-2, -2, 90] };

  function solve(p) {
    const J = {};
    J.hip = [0, 0];
    const tv = up(p.t, L.torso);
    J.sh = add(J.hip, tv);
    // spine midpoint (for curve)
    const mid = [J.hip[0] + tv[0] / 2, J.hip[1] + tv[1] / 2];
    const nrm = [Math.cos(p.t * R), -Math.sin(p.t * R)]; // perpendicular (back side when facing right & upright -> left)
    const c = p.c || 0;
    J.spineCtl = [mid[0] - nrm[0] * c, mid[1] - nrm[1] * c];
    J.head = add(J.sh, up(p.t + (p.h || 0), L.neck + L.head));
    J.neck = add(J.sh, up(p.t + (p.h || 0), L.neck));
    for (const s of ['N', 'F']) {
      const a = p['a' + s], l = p['l' + s];
      J['elb' + s] = add(J.sh, down(a[0], L.ua * (a[2] || 1)));
      J['hand' + s] = add(J['elb' + s], down(a[1], L.fa * (a[3] || 1)));
      J['knee' + s] = add(J.hip, down(l[0], L.th * (l[3] || 1)));
      J['ank' + s] = add(J['knee' + s], down(l[1], L.sh * (l[4] || 1)));
      J['toe' + s] = add(J['ank' + s], down(l[2], L.ft));
      J['heel' + s] = add(J['ank' + s], down(l[2] + 180, 3));
    }
    return J;
  }

  function lerpPose(a, b, k) {
    const o = {};
    for (const key of Object.keys(b)) {
      const va = a[key] === undefined ? STAND[key] : a[key];
      const vb = b[key];
      if (Array.isArray(vb)) {
        o[key] = vb.map((x, i) => {
          const y = (va && va[i] !== undefined) ? va[i] : x;
          return y + (x - y) * k;
        });
      } else o[key] = va + (vb - va) * k;
    }
    for (const key of Object.keys(a)) if (o[key] === undefined) o[key] = a[key];
    return o;
  }

  function full(p) { return Object.assign({}, STAND, p); }

  function place(J, anchor) {
    anchor = anchor || {};
    const keys = Object.keys(J);
    let dx = 0, dy = 0;
    const aj = anchor.j || 'hip';
    const ax = anchor.x === undefined ? 100 : anchor.x;
    dx = ax - J[aj][0];
    if (anchor.y !== undefined) {
      dy = anchor.y - J[aj][1];
    } else {
      const ground = anchor.g || 0;
      const pts = (anchor.contacts || keys).filter(k => k !== 'spineCtl');
      let min = Infinity;
      const RAD = { head: L.head, hip: 6.5, sh: 6, neck: 2.7 };
      for (const k of pts) {
        let y = J[k][1];
        y -= RAD[k] !== undefined ? RAD[k] : /^knee/.test(k) ? 3.4 : /^ank/.test(k) ? 2.1 : /^(toe|heel)/.test(k) ? 1.8 : /^hand/.test(k) ? 2.2 : /^elb/.test(k) ? 2.4 : 0;
        if (y < min) min = y;
      }
      dy = ground - min;
    }
    const out = {};
    for (const k of keys) out[k] = [J[k][0] + dx, J[k][1] + dy];
    return out;
  }

  // model -> svg
  const GY = 121;
  const X = p => p[0].toFixed(1);
  const Y = p => (GY - p[1]).toFixed(1);
  const line = (a, b, cls) => `<line class="${cls}" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`;

  /* ---- body renderer: tapered limbs, shaped torso, muscle highlights ---- */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
  const f1 = n => n.toFixed(1);
  // model -> svg point
  const S = p => [p[0], GY - p[1]];
  function capsule(a, b, ra, rb) { // model points
    const A = S(a), B = S(b), d = unit(sub(B, A)), n = [-d[1], d[0]];
    const p1 = [A[0] + n[0] * ra, A[1] + n[1] * ra], p2 = [B[0] + n[0] * rb, B[1] + n[1] * rb];
    const p3 = [B[0] - n[0] * rb, B[1] - n[1] * rb], p4 = [A[0] - n[0] * ra, A[1] - n[1] * ra];
    return `M${f1(p1[0])} ${f1(p1[1])}L${f1(p2[0])} ${f1(p2[1])}A${f1(rb)} ${f1(rb)} 0 0 0 ${f1(p3[0])} ${f1(p3[1])}L${f1(p4[0])} ${f1(p4[1])}A${f1(ra)} ${f1(ra)} 0 0 0 ${f1(p1[0])} ${f1(p1[1])}Z`;
  }
  const circ = (c, r) => { const C = S(c); return `M${f1(C[0] - r)} ${f1(C[1])}a${r} ${r} 0 1 0 ${f1(2 * r)} 0a${r} ${r} 0 1 0 ${f1(-2 * r)} 0Z`; };
  // quadratic bezier in model space
  const qb = (p0, p1, p2, t) => [(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0], (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];
  const qbd = (p0, p1, p2, t) => unit([2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]), 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1])]);
  const TS = [0, .18, .36, .55, .72, .86, 1];
  const FRONT = [7.0, 6.6, 6.4, 7.2, 8.4, 8.0, 6.6]; // belly / chest side
  const BACK = [8.2, 7.0, 6.2, 6.4, 7.0, 7.2, 6.2];  // glute / back side
  function torsoPath(J) {
    const fr = [], bk = [];
    TS.forEach((t, i) => {
      const p = qb(J.hip, J.spineCtl, J.sh, t), d = qbd(J.hip, J.spineCtl, J.sh, t);
      const ant = [d[1], -d[0]]; // rotate clockwise in model space = front of the body
      fr.push([p[0] + ant[0] * FRONT[i], p[1] + ant[1] * FRONT[i]]);
      bk.push([p[0] - ant[0] * BACK[i], p[1] - ant[1] * BACK[i]]);
    });
    const pts = fr.concat(bk.reverse()).map(S);
    // smooth closed curve through points (Catmull-Rom -> cubic)
    let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${f1(c1[0])} ${f1(c1[1])} ${f1(c2[0])} ${f1(c2[1])} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  function limbPaths(J, s) {
    return [
      capsule(J.hip, J['knee' + s], 5.0, 3.5),
      capsule(J['knee' + s], J['ank' + s], 3.4, 2.1),
      capsule(J['heel' + s], J['toe' + s], 2.3, 1.7),
      capsule(J.sh, J['elb' + s], 3.1, 2.4),
      capsule(J['elb' + s], J['hand' + s], 2.3, 1.7),
      circ(J['hand' + s], 2.2),
    ].join('');
  }
  // Muscle highlight geometry: segment, side (+1 front, -1 back, 0 centre), position along it, size
  const MUSCLE = {
    quad: ['th', 1, .48, .34, .62], ham: ['th', -1, .5, .34, .62], hipflex: ['th', 1, .12, .17, .6], adductor: ['th', 0, .33, .28, .45],
    calf: ['sh', -1, .28, .26, .8], soleus: ['sh', -1, .55, .26, .62], shin: ['sh', 1, .35, .28, .55],
    biceps: ['ua', 1, .5, .3, .6], triceps: ['ua', -1, .5, .3, .62], shoulder: ['ua', 0, .1, .17, .85],
    core: ['torso', 1, .3, .2, .5], lowback: ['torso', -1, .22, .17, .5], lats: ['torso', -1, .62, .22, .5], spine: ['torso', -1, .5, .46, .3], chest: ['torso', 1, .8, .14, .55],
    glute: ['glute'], ankle: ['ankle'],
  };
  function muscleShape(J, name, s) {
    const m = MUSCLE[name]; if (!m) return '';
    if (m[0] === 'glute') {
      const d = qbd(J.hip, J.spineCtl, J.sh, 0), ant = [d[1], -d[0]];
      const c = [J.hip[0] - ant[0] * 3.6 + d[0] * 1.5, J.hip[1] - ant[1] * 3.6 + d[1] * 1.5];
      return circ(c, 4.2);
    }
    if (m[0] === 'ankle') { const A = S(J['ank' + s]); return `M${f1(A[0] - 3.4)} ${f1(A[1])}a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0 -6.8 0Z`; }
    let a, b, w, ant;
    if (m[0] === 'torso') {
      const t = m[2], p = qb(J.hip, J.spineCtl, J.sh, t), d = qbd(J.hip, J.spineCtl, J.sh, t);
      ant = [d[1], -d[0]]; w = 7.2;
      const len = Math.hypot(...sub(J.sh, J.hip));
      const c = [p[0] + ant[0] * m[1] * w * 0.48, p[1] + ant[1] * m[1] * w * 0.48];
      const C = S(c), ang = Math.atan2(-d[1], d[0]) * 180 / Math.PI;
      return `<ellipse cx="${f1(C[0])}" cy="${f1(C[1])}" rx="${f1(len * m[3])}" ry="${f1(w * m[4])}" transform="rotate(${f1(ang)} ${f1(C[0])} ${f1(C[1])})"/>`;
    }
    if (m[0] === 'th') { a = J.hip; b = J['knee' + s]; w = 4.3; }
    else if (m[0] === 'sh') { a = J['knee' + s]; b = J['ank' + s]; w = 2.8; }
    else { a = J.sh; b = J['elb' + s]; w = 2.8; }
    const d = unit(sub(b, a)); ant = [-d[1], d[0]]; // counter-clockwise = front of the leg/arm
    const len = Math.hypot(...sub(b, a));
    const c = [a[0] + d[0] * len * m[2] + ant[0] * m[1] * w * 0.42, a[1] + d[1] * len * m[2] + ant[1] * m[1] * w * 0.42];
    const C = S(c), ang = Math.atan2(-d[1], d[0]) * 180 / Math.PI;
    return `<ellipse cx="${f1(C[0])}" cy="${f1(C[1])}" rx="${f1(len * m[3])}" ry="${f1(w * m[4])}" transform="rotate(${f1(ang)} ${f1(C[0])} ${f1(C[1])})"/>`;
  }
  function musclesFor(J, work, s) {
    let out = '';
    for (const w of work || []) {
      const side = /[NF]$/.test(w) ? w.slice(-1) : null, name = side ? w.slice(0, -1) : w;
      const torsoish = /^(core|lowback|lats|spine|chest|glute)$/.test(name);
      if (torsoish) { if (s === 'T') out += wrapPath(muscleShape(J, name, 'N')); continue; }
      if (s === 'T') continue;
      if (side && side !== s) continue;
      out += wrapPath(muscleShape(J, name, s));
    }
    return out;
  }
  const wrapPath = x => !x ? '' : x.startsWith('<') ? x : `<path d="${x}"/>`;
  function draw(J, work) {
    const nose = (() => { const d = unit(sub(J.head, J.neck)), ant = [d[1], -d[0]]; return [J.head[0] + ant[0] * 5.6 - d[0] * 0.6, J.head[1] + ant[1] * 5.6 - d[1] * 0.6]; })();
    const farP = limbPaths(J, 'F');
    const bodyP = torsoPath(J) + capsule(J.sh, J.head, 2.7, 2.7) + circ(J.head, L.head) + circ(nose, 1.6);
    const nearP = limbPaths(J, 'N');
    let s = '';
    s += `<path class="bd halo" d="${farP}"/><path class="bd far" d="${farP}"/>`;
    s += `<g class="mu far">${musclesFor(J, work, 'F')}</g>`;
    s += `<path class="bd halo" d="${bodyP}"/><path class="bd body" d="${bodyP}"/>`;
    s += `<g class="mu">${musclesFor(J, work, 'T')}</g>`;
    s += `<path class="bd halo" d="${nearP}"/><path class="bd near" d="${nearP}"/>`;
    s += `<g class="mu">${musclesFor(J, work, 'N')}</g>`;
    return s;
  }

  // ---------- props ----------
  const P = {
    floor: () => `<line class="gnd" x1="-20" y1="${GY}" x2="220" y2="${GY}"/>`,
    db: (j) => J => { const h = J[j]; return `<rect class="pr fill" x="${(h[0] - 6).toFixed(1)}" y="${(GY - h[1] - 3).toFixed(1)}" width="12" height="6" rx="2"/>`; },
    box: (j, w, side) => J => { // box under a joint's foot
      const a = J[j]; const top = a[1] - 2;
      const x0 = side === 'back' ? a[0] - w + 6 : a[0] - 8;
      return `<rect class="pr" x="${x0.toFixed(1)}" y="${(GY - top).toFixed(1)}" width="${w}" height="${top.toFixed(1)}" rx="1.5"/>`;
    },
    stepFwd: (j, w) => J => { const a = J[j]; const top = a[1]; return `<rect class="pr" x="${(a[0] - 7).toFixed(1)}" y="${(GY - top).toFixed(1)}" width="${w}" height="${top.toFixed(1)}" rx="1.5"/>`; },
    wallAt: x => () => `<line class="pr wall" x1="${x}" y1="${GY}" x2="${x}" y2="12"/>`,
    wallFront: (j, off) => J => { const x = J[j][0] + off; return `<line class="pr wall" x1="${x.toFixed(1)}" y1="${GY}" x2="${x.toFixed(1)}" y2="12"/>`; },
    wallBehind: (off) => J => { const x = Math.min(J.head[0] - L.head, J.sh[0], J.hip[0]) - (off || 2); return `<line class="pr wall" x1="${x.toFixed(1)}" y1="${GY}" x2="${x.toFixed(1)}" y2="12"/>`; },
    bar: (j) => J => { const h = J[j]; return `<line class="pr thick" x1="${(h[0] - 30).toFixed(1)}" y1="${(GY - h[1]).toFixed(1)}" x2="${(h[0] + 30).toFixed(1)}" y2="${(GY - h[1]).toFixed(1)}"/>`; },
    seat: (h, x0, x1, backX0, backY0, backX1, backY1) => () =>
      `<line class="pr thick" x1="${x0}" y1="${GY - h}" x2="${x1}" y2="${GY - h}"/>` +
      (backX0 !== undefined ? `<line class="pr thick" x1="${backX0}" y1="${GY - backY0}" x2="${backX1}" y2="${GY - backY1}"/>` : '') +
      `<line class="pr" x1="${(x0 + x1) / 2}" y1="${GY - h}" x2="${(x0 + x1) / 2}" y2="${GY}"/>`,
    pad: (j, dx, dy) => J => { const a = J[j]; return `<circle class="pr fill" cx="${(a[0] + (dx || 0)).toFixed(1)}" cy="${(GY - a[1] - (dy || 0)).toFixed(1)}" r="4"/>`; },
    plate: (j, ang) => J => { // plate through joint, perpendicular to push direction ang (from down)
      const a = J[j]; const d = [Math.cos(ang * R), Math.sin(ang * R)]; // perpendicular-ish
      const v = down(ang + 90, 1);
      const p1 = [a[0] + v[0] * 20, a[1] + v[1] * 20], p2 = [a[0] - v[0] * 12, a[1] - v[1] * 12];
      const n = down(ang, 4);
      const q1 = add(p1, n), q2 = add(p2, n);
      return `<line class="pr thick" x1="${X(q1)}" y1="${Y(q1)}" x2="${X(q2)}" y2="${Y(q2)}"/>`;
    },
    rail: (x0, y0, x1, y1) => () => `<line class="pr" x1="${x0}" y1="${GY - y0}" x2="${x1}" y2="${GY - y1}"/>`,
    strap: (a, b) => J => line(J[a], J[b], 'pr strap'),
    mat: () => `<rect class="pr mat" x="14" y="${GY - 2}" width="172" height="3" rx="1.5"/>`,
    frameAt: (j, off) => J => { const x = J[j][0] + off; return `<line class="pr wall" x1="${x.toFixed(1)}" y1="${GY}" x2="${x.toFixed(1)}" y2="8"/>`; },
    legPress: () => J => {
      const h = J.hip, d = up(-58, 1), n = [-d[1], d[0]];
      const b0 = [h[0] + n[0] * -5, h[1] + n[1] * -5];
      const b0s = [h[0] - 4, h[1] - 6], b1 = [b0s[0] + d[0] * 40, b0s[1] + d[1] * 40];
      const seat0 = [h[0] - 8, h[1] - 6], seat1 = [h[0] + 14, h[1] - 6];
      const r = down(125, 1), q = [-r[1], r[0]];
      const a = J.ankN; const o = [a[0] + q[0] * 9, a[1] + q[1] * 9];
      const r0 = [o[0] - r[0] * 40, o[1] - r[1] * 40], r1 = [o[0] + r[0] * 34, o[1] + r[1] * 34];
      return line(b0s, b1, 'pr thick') + line(seat0, seat1, 'pr thick') +
        line([h[0] + 2, h[1] - 6], [h[0] + 2, 0], 'pr') + line(r0, r1, 'pr') +
        line([r0[0], r0[1]], [r0[0], 0], 'pr') + line([r1[0], r1[1]], [r1[0], 0], 'pr');
    },
    rope: () => J => {
      const v = J.ropeV || 0, hN = J.handN, hF = J.handF;
      const top = [J.head[0] - 3, J.head[1] + 17], bot = [(J.toeN[0] + J.heelN[0]) / 2, -1.2];
      const ang = v * Math.PI, cx = (top[0] + bot[0]) / 2, cy = (top[1] + bot[1]) / 2, ry = (top[1] - bot[1]) / 2;
      const apex = [cx + Math.sin(ang) * 26, cy + Math.cos(ang) * ry];
      const strand = (h, sgn) => {
        const m = [(h[0] + apex[0]) / 2, (h[1] + apex[1]) / 2], d = unit(sub(apex, h)), n = [-d[1], d[0]];
        const c = [m[0] + n[0] * 9 * sgn, m[1] + n[1] * 9 * sgn];
        return `M${f1(h[0])} ${f1(GY - h[1])}Q${f1(c[0])} ${f1(GY - c[1])} ${f1(apex[0])} ${f1(GY - apex[1])}`;
      };
      return `<path class="pr rope" d="${strand(hN, 1)}"/><path class="pr rope" d="${strand(hF, -1)}"/>`;
    },
    chair: (h, x) => () => `<line class="pr thick" x1="${x - 20}" y1="${GY - h}" x2="${x + 14}" y2="${GY - h}"/><line class="pr" x1="${x - 16}" y1="${GY - h}" x2="${x - 16}" y2="${GY}"/><line class="pr" x1="${x + 10}" y1="${GY - h}" x2="${x + 10}" y2="${GY}"/><line class="pr thick" x1="${x - 20}" y1="${GY - h}" x2="${x - 22}" y2="${GY - h - 34}"/>`,
  };

  function frameSVG(move, poseK, opt) {
    const pose = full(poseK);
    let J = solve(pose);
    J = place(J, move.anchor);
    if (pose.lift) for (const k of Object.keys(J)) J[k] = [J[k][0], J[k][1] + pose.lift];
    J.ropeV = pose.ropeV;
    let s = '';
    if (!move.noFloor) s += P.floor();
    for (const pr of (move.props || [])) s += typeof pr === 'function' ? pr(J) : pr;
    s += draw(J, opt && opt.plain ? null : move.work);
    for (const pr of (move.over || [])) s += pr(J);
    return s;
  }

  function poseAt(move, time) {
    const keys = move.keys;
    if (keys.length === 1) return keys[0];
    const dur = move.dur || 3.2;
    const n = move.loop ? keys.length : (keys.length - 1) * 2;
    const seg = dur / n * (move.loop ? 1 : 1);
    let tt = (time % (seg * n)) / seg;
    let i = Math.floor(tt), f = tt - i;
    let a, b;
    if (move.loop) { a = keys[i % keys.length]; b = keys[(i + 1) % keys.length]; }
    else {
      // ping-pong with holds at ends
      const fw = keys.length - 1;
      if (i < fw) { a = keys[i]; b = keys[i + 1]; }
      else { const j = i - fw; a = keys[fw - j]; b = keys[fw - j - 1]; }
    }
    const hold = move.hold ? 0.35 : 0.18;

/* ---------- calories & nutrition ----------
   Burn: MET × kg × hours (2024 Compendium of Physical Activities).
   Intake: Mifflin-St Jeor BMR × 1.3 (desk job + daily life) − weight-loss deficit + 75% of exercise burn.
   Macros: protein 2 g/kg goal weight; fat ≥ 0.8 g/kg goal and ≥ 25% of calories; carbs fill the rest.
   Free sugars: under 10% of calories (WHO), ideally ~25 g. */
const LB = 0.45359237;
const toKg = v => UNIT() === 'kg' ? v : v * LB;

  const wl = weightLog().filter(p => p.date <= d);

}
function bmrOn(d) {
  const s = settings();

  return 10 * kgOn(d) + 6.25 * num(s.heightCm) - 5 * num(s.age) + (s.sex === 'f' ? -161 : 5);
}
function dailyDeficit() {

}
const kcalMET = (met, kg, min) => met * kg * min / 60;
function runMET(kmh) { // Compendium running/jogging values by speed

  if (!(kmh > 0)) kmh = 7.5;

  for (let i = 1; i < T.length; i++) if (kmh <= T[i][0]) { const [x0, y0] = T[i - 1], [x1, y1] = T[i]; return y0 + (y1 - y0) * (kmh - x0) / (x1 - x0); }

}

  return kcalMET(runMET(kmh), kg, km / kmh * 60);
}
function exBurn(id, d, kg, logged) {

  const n = sets.length || t.sets;
  if (id === 'jump-rope') {
    const work = sets.length ? sets.reduce((a, x) => a + num(x.r), 0) : n * (t.test ? 40 : t.v);
    return kcalMET(11.8, kg, work / 60) + kcalMET(2.5, kg, (n - 1));
  }
  if (ex.kind === 'weight') return kcalMET(5.0, kg, n * 2.5 * (ex.perSide ? 1.6 : 1));
  if (ex.kind === 'reps') return kcalMET(3.8, kg, n * 1.5 * (ex.perSide ? 1.6 : 1));
  const sec = sets.length ? sets.reduce((a, x) => a + num(x.r), 0) / n : (t.test ? 30 : t.v);
  return kcalMET(2.8, kg, n * (sec + 45) / 60 * (ex.perSide ? 2 : 1));
}
const stretchBurn = (mode, kg) => kcalMET(2.3, kg, mode === 'full' ? 15 : 6);
function sessionBurn(s, kg) {

  if (s.km || s.kind === 'extra-run') {

    out.run = runBurn(km, num(r.km) > 0 ? parseTime(r.time) : NaN, kg);

  if (s.strength) for (const id of GROUPS[s.strength]) { const b = (l.skipEx && l.skipEx[id]) ? 0 : exBurn(id, s.date, kg, l.sets && l.sets[id]); out.ex[id] = b; out.strength += b; }

function dayFuel(d) {
  const list = sessionsOn(d), kg = kgOn(d);

  const burn = burns.reduce((a, b) => a + b.total, 0);
  const type = list.some(s => s.kind === 'long' || s.kind === 'race') ? 'long' : list.length ? 'train' : 'rest';

/* Coach: prompts an extra session when weight falls behind the goal line */
function coach(d) {
  const st = settings(), wl = weightLog().filter(p => p.date <= d);
  if (wl.length < 2 || daysBetween(wl[0].date, wl[wl.length - 1].date) < 10) return null;
  const recent = wl.filter(p => daysBetween(p.date, wl[wl.length - 1].date) <= 7);
  const avg = recent.reduce((a, p) => a + p.v, 0) / recent.length;
  const ref = recent[recent.length - 1].date;

    <h2>You're ${c.behind} ${u} behind your goal line</h2>
    ${food ? `<p>Your logged meals average <b>${c.avgOver} kcal</b> over target. Bringing food back to target is the quickest fix; one extra session helps too.</p>`
      : `<p>To catch up, add <b>one extra session a week</b> until you're back on the line: a 30–40 minute easy run or cross-training (bike, rower, elliptical). That burns roughly 300–450 kcal, about ${u === 'kg' ? '0.05 kg' : '0.1 lb'} of fat each time, without adding much pounding.</p>`}
    <p class="muted">Keep it easy and leave a rest day before your long run. Weigh yourself at the same time of day; single readings swing by 1–2 ${u}.</p>
    ${c.week >= 1 && c.week <= PLAN.length ? `<button class="btn sm" data-act="addweek" data-w="${c.week}">Add an extra session this week</button>` : ''}
  </section>`;

/* ---------- moving a workout within its week (defaults untouched) ---------- */
function moveSession(key, from, to, defDate) {
  if (from === to) return;
  const map = Object.assign({}, moved());
  if (to === defDate) delete map[key]; else map[key] = to;
  // carry anything already logged for this workout to its new day
  const src = logDoc(from);
  if (src && src.sessions && src.sessions[key]) {

    const a = clone(src), b = clone(logDoc(to) || { date: to, sessions: {} });
    b.sessions = b.sessions || {}; b.sessions[key] = a.sessions[key]; delete a.sessions[key];
    Store.put('logs/' + to, b); Store.put('logs/' + from, a);
  }
  Store.put('app/moves', { map });
}
function weekWarnings(ss) {
  const runs = ss.filter(s => s.km || s.kind === 'extra-run').map(s => s.date).sort();
  for (let i = 1; i < runs.length; i++) {
    const g = daysBetween(runs[i - 1], runs[i]);
    if (g === 0) return 'Two runs are on the same day this week.';
    if (g === 1) return 'Two runs are on back-to-back days this week. A rest day between runs lowers injury risk.';
  }
  const lng = ss.find(s => s.kind === 'long'), q = ss.find(s => s.kind === 'quality');
  return '';
}

/* ---------- plan file: a JSON copy the person places where they choose ----------
   With the File System Access API (Chrome/Edge on a computer), the app keeps a handle to
   the chosen file, writes to it after every change, and on open loads it when it is newer.
   Elsewhere (iPhone, Safari, inside the Claude app) saving asks where to put the file each time. */
const IDB = {
  db: null,
  open() { return this.db || (this.db = new Promise((res, rej) => { try { const r = indexedDB.open('marathon-build', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); },
  async get(k) { try { const d = await this.open(); return await new Promise((res, rej) => { const t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const d = await this.open(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { } },
  async del(k) { try { const d = await this.open(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
};
const PlanFile = {
  handle: null, name: '', lastSaved: null, lastLoaded: null, needsPermission: false, timer: null, lastMod: 0, busy: false,
  supported() { try { return typeof window.showSaveFilePicker === 'function' && window.self === window.top; } catch (e) { return false; } },
  async init() {
    if (!this.supported()) return;
    const h = await IDB.get('planFile'); if (!h) return;
    this.handle = h; this.name = h.name;
    await this.sync(false);
    // autosave on open: overwrite the file with the current plan unless the file was just loaded
    if (!this.lastLoaded && await this.permitted(false)) { try { await this.write(); refreshFileUI(); } catch (e) { } }
    // keep checking while the app is open, so a newer file (saved on another device) is picked up
    setInterval(() => { if (document.visibilityState === 'visible') this.sync(false); }, 30000);
    window.addEventListener('focus', () => this.sync(false));
  },
  async permitted(ask) {
    if (!this.handle) return false;

    try {
      const file = await this.handle.getFile();

        this.lastMod = file.lastModified;
        let obj = null; try { obj = JSON.parse(await file.text()); } catch (e) { }
        if (obj && obj.app === 'marathon-build' && obj.docs) {
          const fileTime = obj.exported || '', mine = localUpdated();
          if (fileTime > mine && JSON.stringify(obj.docs) !== JSON.stringify(Store.docs)) {
            if (Store.mode === 'db') { this.lastLoaded = null; } // the synced store is the source of truth online
            else { applyDocs(obj.docs, fileTime); this.lastLoaded = new Date(); toast('Loaded the newest plan from ' + this.name); render(); }
          } else if (mine > fileTime) await this.write();
        } else if (file.size === 0) await this.write();
      }
    } catch (e) { if (e && e.name === 'NotFoundError') { toast('Your plan file was moved or deleted. Choose where to save it again in Settings.'); await this.unlink(); } }
    this.busy = false; refreshFileUI();
  },
  async write() {
    if (!this.handle) return;
    const w = await this.handle.createWritable(); await w.write(backupJSON()); await w.close();
    const f = await this.handle.getFile(); this.lastMod = f.lastModified; this.lastSaved = new Date();
  },
  changed() {
    if (!this.handle) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => { if (await this.permitted(false)) { try { await this.write(); } catch (e) { } refreshFileUI(); } else refreshFileUI(); }, 1500);
  },
  async choose() {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: (settings().planFileName || 'Marathon plan') + '.json', types: [{ description: 'Marathon plan', accept: { 'application/json': ['.json'] } }] });
      this.handle = h; this.name = h.name; await IDB.set('planFile', h);
      await this.write(); toast('Plan saved to ' + h.name + '. It updates automatically.'); refreshFileUI();
    } catch (e) { if (e && e.name !== 'AbortError') toast('Couldn’t save there. Try another folder.'); }
  },
  async open() {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Marathon plan', accept: { 'application/json': ['.json'] } }] });
      const obj = JSON.parse(await (await h.getFile()).text());
      if (!obj || obj.app !== 'marathon-build' || !obj.docs) { toast('That file isn’t a plan from this app.'); return; }
      this.handle = h; this.name = h.name; await IDB.set('planFile', h);
      if (await this.permitted(true)) { applyDocs(obj.docs, obj.exported || new Date().toISOString()); this.lastMod = (await h.getFile()).lastModified; this.lastLoaded = new Date(); toast('Loaded ' + h.name + '. Changes now save to it automatically.'); render(); }
    } catch (e) { if (e && e.name !== 'AbortError') toast('Couldn’t open that file.'); }
  },
  async unlink() { this.handle = null; this.name = ''; this.lastSaved = null; this.needsPermission = false; await IDB.del('planFile'); refreshFileUI(); },
};
/* ---------- autosave: restore points kept inside the app ----------

const Snaps = {
